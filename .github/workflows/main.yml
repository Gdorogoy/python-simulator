name: Run Python Simulator

#when to run
on:
  push:
    branches: ["main", "dev"]
  workflow_dispatch:
    inputs:
      profile:
        description: "Training profile"
        type: choice
        options: [acro, angle]
        default: acro
# to not run too much
concurrency:
  group: gpu-sim-runner
  cancel-in-progress: true

# what to run
jobs:
  simulate:
    runs-on: self-hosted # to run this pc
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[train-drone]') # to run only if needed
    env:
      PROFILE: ${{ inputs.profile || 'acro' }} # manual runs pick it, pushes default to acro

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      #some checks
      - name: Check GPU
        run: nvidia-smi

      # self explanatory
      - name: Sync code to Windows project folder
        run: |
          rsync -av --delete \
            --exclude='.git' \
            --exclude='runs/' \
            --exclude='stable_models/' \
            ./ /mnt/c/Users/Pc-Egor/PycharmProjects/WelcomeScreen/python-simulator/

      # finally trian it
      - name: Run simulation
        run: |
          cd /mnt/c/Users/Pc-Egor/PycharmProjects/WelcomeScreen/python-simulator
          python3 app/workflow/workflow.py --profile "$PROFILE"

      # so the weight could actually be stored
      - name: Collect training results
        run: python3 app/workflow/collect_results.py --profile "$PROFILE"

      # so the weigths could actually be used
      - name: Upload training artifacts
        uses: actions/upload-artifact@v4
        with:
          name: training-results-${{ inputs.profile || 'acro' }}-${{ github.run_number }}
          path: runs/
          retention-days: 3
