[project]
name = "python-simulator"
version = "0.1.0"
description = "Quadcopter interception: physics simulator, PID teacher and PPO policies trained in Isaac Lab"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.3.0",
    "imageio>=2.37.4",
    "imageio-ffmpeg>=0.6.0",
    "matplotlib>=3.11.1",
    "mlflow>=3.16.0",
    "numpy>=2.5.1",
    "onnx>=1.22.0",
    "onnxscript>=0.7.1",
    "opencv-python>=5.0.0.93",
    "optuna>=5.0.0",
    "python-multipart>=0.0.32",
    "scipy>=1.18.0",
    "scipy-stubs~=1.18.0",
    "torch>=2.13.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
