[project]
name = "python-simulator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gym",
    "gymnasium>=1.3.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "opencv-python>=5.0.0.93",
    "optuna>=4.0.0",
    "pybullet",
    "scipy>=1.18.0",
    "scipy-stubs~=1.18.0",
    "torch>=2.13.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
